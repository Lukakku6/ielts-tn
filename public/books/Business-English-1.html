<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English with Dali · Business English Level 1</title>
<style>
:root{
  --red:#E53E3E;--teal:#1D9E75;--blue:#378ADD;--orange:#E67E22;--purple:#8E44AD;
  --bg:#f7f5f0;--white:#fff;--gray:#f0ede6;--text:#1a1a1a;--muted:#666;
  --border:#e2ddd4;--sidebar:260px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;display:flex;flex-direction:column}

/* TOP BAR */
.topbar{background:var(--red);color:#fff;padding:0 1.25rem;height:52px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;z-index:20}
.topbar-left{display:flex;align-items:center;gap:10px}

.topbar h1{font-size:14px;font-weight:600;opacity:.95}
.topbar-right{display:flex;align-items:center;gap:12px}
.overall-prog{display:flex;align-items:center;gap:8px;font-size:12px}
.overall-bar{width:100px;height:5px;background:rgba(255,255,255,.3);border-radius:999px;overflow:hidden}
.overall-bar-fill{height:100%;background:#fff;border-radius:999px;transition:width .5s ease}
.home-btn{background:rgba(255,255,255,.18);border:none;color:#fff;font-size:12px;padding:5px 12px;border-radius:6px;cursor:pointer;font-family:inherit;transition:background .15s}
.home-btn:hover{background:rgba(255,255,255,.3)}

/* LAYOUT */
.main{display:flex;flex:1;overflow:hidden}

/* SIDEBAR */
.sidebar{width:var(--sidebar);background:var(--white);border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column}
.sidebar-search{padding:.75rem;border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff;z-index:5}
.sidebar-search input{width:100%;border:1px solid var(--border);border-radius:7px;padding:6px 10px;font-size:12px;font-family:inherit;outline:none;background:var(--gray)}
.sidebar-search input:focus{border-color:var(--red)}
.cat-group{}
.cat-label{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.09em;text-transform:uppercase;padding:.6rem .75rem .3rem;background:var(--gray);border-bottom:1px solid var(--border);border-top:1px solid var(--border);position:sticky;top:45px}
.mod-item{display:flex;align-items:center;gap:8px;padding:.5rem .75rem;cursor:pointer;border-bottom:1px solid #f5f2ec;transition:background .12s;border-left:3px solid transparent}
.mod-item:hover{background:var(--gray)}
.mod-item.active{background:#fef3f3;border-left-color:var(--red)}
.mod-item.done{opacity:.7}
.mod-num{font-size:10px;font-weight:700;color:var(--muted);width:22px;flex-shrink:0}
.mod-name{font-size:12px;color:var(--text);line-height:1.3;flex:1}
.mod-check{font-size:12px;color:var(--teal);flex-shrink:0}

/* HOME SCREEN */
.home-screen{flex:1;overflow-y:auto;padding:1.5rem}
.home-title{font-size:22px;font-weight:700;margin-bottom:.25rem}
.home-sub{font-size:13px;color:var(--muted);margin-bottom:1.5rem}
.home-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:1.75rem}
.hstat{background:#fff;border:1px solid var(--border);border-radius:12px;padding:1rem;text-align:center}
.hstat .n{font-size:28px;font-weight:700;color:var(--red)}
.hstat .l{font-size:11px;color:var(--muted);margin-top:2px}
.home-cat{margin-bottom:1.5rem}
.home-cat-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin-bottom:.6rem}
.home-cat-dot{width:10px;height:10px;border-radius:50%}
.home-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(195px,1fr));gap:8px}
.hcard{background:#fff;border:1px solid var(--border);border-left:3px solid var(--red);border-radius:10px;padding:.875rem;cursor:pointer;transition:all .14s}
.hcard:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,.09)}
.hcard-num{font-size:10px;color:var(--muted);font-weight:700;margin-bottom:3px}
.hcard-title{font-size:13px;font-weight:700;line-height:1.3;margin-bottom:.4rem}
.hcard-tags{display:flex;flex-wrap:wrap;gap:4px}
.hcard-tag{font-size:10px;padding:2px 7px;border-radius:999px;font-weight:600}
.tag-lang{background:#faeeda;color:#6b3d07}
.tag-vocab{background:#e1f5ee;color:#085041}
.tag-skill{background:#eeedfe;color:#2d2660}
.hcard-done{color:var(--teal);font-size:11px;margin-top:6px;font-weight:600}

/* SLIDE AREA */
.slide-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
.slide-header{background:#fff;border-bottom:1px solid var(--border);padding:.75rem 1.25rem;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.slide-unit-title{font-size:15px;font-weight:700;color:var(--text)}
.slide-unit-sub{font-size:11px;color:var(--muted);margin-top:2px}
.slide-prog-wrap{display:flex;align-items:center;gap:10px}
.slide-prog-text{font-size:11px;color:var(--muted);white-space:nowrap}
.slide-prog-bar{width:120px;height:5px;background:var(--gray);border-radius:999px;overflow:hidden}
.slide-prog-fill{height:100%;background:var(--red);border-radius:999px;transition:width .35s ease}
.slide-content{flex:1;overflow-y:auto;padding:1.5rem;display:flex;justify-content:center}
.slide-inner{width:100%;max-width:820px}
.slide-nav{background:#fff;border-top:1px solid var(--border);padding:.75rem 1.25rem;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.nav-btn{border:none;border-radius:8px;padding:9px 20px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s;display:flex;align-items:center;gap:6px}
.nav-btn:disabled{opacity:.3;cursor:default}
.btn-back{background:var(--gray);color:var(--text)}
.btn-back:hover:not(:disabled){background:var(--border)}
.btn-next{background:var(--red);color:#fff}
.btn-next:hover:not(:disabled){background:#c53030}
.slide-dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;max-width:400px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--border);cursor:pointer;transition:all .2s}
.dot.active{background:var(--red);transform:scale(1.3)}
.dot.done{background:var(--teal)}

/* SLIDE TYPES */
.slide{display:none;animation:fadeSlide .4s ease}
.slide.active{display:block}
@keyframes fadeSlide{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

/* INTRO SLIDE */
.intro-slide{text-align:center;padding:2rem 1rem}
.intro-num{display:inline-block;background:var(--red);color:#fff;font-size:13px;font-weight:700;padding:4px 14px;border-radius:6px;margin-bottom:.75rem;letter-spacing:.04em}
.intro-title{font-size:32px;font-weight:800;margin-bottom:.75rem;line-height:1.2}
.intro-desc{font-size:15px;color:var(--muted);max-width:520px;margin:0 auto 1.5rem;line-height:1.6}
.intro-tags{display:flex;justify-content:center;flex-wrap:wrap;gap:10px}
.intro-tag{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--border);border-radius:8px;padding:.5rem .875rem;font-size:13px}
.intro-tag-icon{font-size:16px}
.intro-tag-label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;display:block;margin-bottom:1px}
.intro-tag-val{font-size:13px;color:var(--text);font-weight:600}

/* SECTION TITLE */
.section-badge{display:inline-flex;align-items:center;gap:6px;background:var(--red);color:#fff;font-size:11px;font-weight:700;padding:4px 12px;border-radius:6px;margin-bottom:.875rem;letter-spacing:.03em}

/* KEY LANGUAGE */
.key-lang-box{background:#fff7f5;border:2px solid var(--red);border-radius:14px;padding:1.25rem 1.5rem;margin-bottom:1rem}
.key-lang-box h3{font-size:14px;font-weight:700;color:var(--red);margin-bottom:.4rem;text-transform:uppercase;letter-spacing:.04em}
.key-lang-box .subtitle{font-size:13px;color:var(--muted);margin-bottom:1rem}
.bubbles-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bubble-pair{display:flex;flex-direction:column;gap:6px}
.bubble-note{font-size:10px;color:var(--muted);font-style:italic;margin-bottom:3px}
.bubble{display:inline-block;border-radius:12px;padding:.6rem .9rem;font-size:13px;font-weight:600;max-width:90%;line-height:1.4;opacity:0;transform:translateY(8px);transition:all .35s ease}
.bubble.shown{opacity:1;transform:translateY(0)}
.bubble-a{background:var(--teal);color:#fff;align-self:flex-start}
.bubble-b{background:#e6f1fb;color:#0c447c;align-self:flex-end;margin-left:auto}
.bubble-highlight{color:#FFD700}

/* GRAMMAR TABLE */
.grammar-box{background:#fff;border:2px solid var(--blue);border-radius:14px;padding:1.25rem 1.5rem;margin-bottom:1rem}
.grammar-box h3{font-size:14px;font-weight:700;color:var(--blue);margin-bottom:.4rem;text-transform:uppercase}
.grammar-box .subtitle{font-size:13px;color:var(--muted);margin-bottom:1rem;line-height:1.5}
.grammar-table{width:100%;border-collapse:collapse;margin-top:.5rem}
.grammar-table th{background:var(--blue);color:#fff;padding:.6rem .875rem;font-size:12px;font-weight:700;text-align:left;letter-spacing:.04em}
.grammar-table td{padding:.6rem .875rem;font-size:13px;border-bottom:1px solid var(--border)}
.grammar-table tr{opacity:0;transform:translateX(-10px);transition:all .3s ease}
.grammar-table tr.shown{opacity:1;transform:translateX(0)}
.grammar-table tr:nth-child(even) td{background:#f0f4ff}
.grammar-highlight{color:var(--blue);font-weight:700}
.grammar-correct{color:var(--teal);font-weight:700;font-size:15px}
.grammar-wrong{color:var(--red);text-decoration:line-through;opacity:.6}

/* EXAMPLES BOX */
.examples-box{background:#f0faf5;border:2px solid var(--teal);border-radius:14px;padding:1.25rem 1.5rem;margin-bottom:1rem}
.examples-box h3{font-size:14px;font-weight:700;color:var(--teal);margin-bottom:.4rem;text-transform:uppercase}
.example-item{display:flex;align-items:flex-start;gap:10px;padding:.6rem 0;border-bottom:1px solid #d0ede2;opacity:0;transform:translateY(6px);transition:all .3s ease}
.example-item.shown{opacity:1;transform:translateY(0)}
.example-item:last-child{border-bottom:none}
.example-icon{font-size:18px;flex-shrink:0;margin-top:2px}
.example-text{font-size:14px;line-height:1.5}
.example-note{font-size:11px;color:var(--muted);font-style:italic;margin-top:3px}
.ex-highlight{color:var(--teal);font-weight:700}

/* VOCABULARY */
.vocab-box{background:#fff8f0;border:2px solid var(--orange);border-radius:14px;padding:1.25rem 1.5rem;margin-bottom:1rem}
.vocab-box h3{font-size:14px;font-weight:700;color:var(--orange);margin-bottom:.4rem;text-transform:uppercase}
.vocab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin-top:.75rem}
.vocab-item{background:#fff;border:1px solid var(--border);border-radius:8px;padding:.6rem .75rem;opacity:0;transform:scale(.96);transition:all .25s ease}
.vocab-item.shown{opacity:1;transform:scale(1)}
.vocab-word{font-size:13px;font-weight:700;color:var(--orange)}
.vocab-def{font-size:11px;color:var(--muted);margin-top:2px}

/* EXERCISE */
.exercise-box{background:#fff;border:2px solid var(--orange);border-radius:14px;padding:1.25rem 1.5rem;margin-bottom:1rem}
.exercise-box h3{font-size:13px;font-weight:700;color:var(--orange);text-transform:uppercase;letter-spacing:.04em;margin-bottom:.3rem}
.exercise-box .ex-instruction{font-size:13px;color:var(--muted);margin-bottom:1rem;line-height:1.5}
.ex-item{background:var(--gray);border-radius:10px;padding:.875rem 1rem;margin-bottom:.75rem;border:2px solid transparent;transition:border-color .2s}
.ex-item.correct-bg{border-color:var(--teal);background:#eaf6f0}
.ex-item.wrong-bg{border-color:var(--red);background:#fef3f3}
.ex-q{font-size:14px;margin-bottom:.6rem;line-height:1.5}
.ex-blank{display:inline-block;border-bottom:2px solid var(--text);min-width:80px;height:20px;vertical-align:bottom;position:relative}
.options-row{display:flex;flex-wrap:wrap;gap:7px}
.opt{background:#fff;border:1.5px solid var(--border);border-radius:7px;padding:6px 13px;font-size:13px;cursor:pointer;font-family:inherit;transition:all .15s}
.opt:hover:not(:disabled){border-color:var(--orange);background:#fff8f0}
.opt:disabled{cursor:default}
.opt.correct-opt{background:var(--teal);color:#fff;border-color:var(--teal)}
.opt.wrong-opt{background:var(--red);color:#fff;border-color:var(--red)}
.ex-feedback{margin-top:.6rem;font-size:13px;font-weight:600;display:none}
.ex-feedback.show{display:block}
.ex-feedback.ok{color:var(--teal)}
.ex-feedback.bad{color:var(--red)}
.show-ans-btn{background:transparent;border:1.5px solid var(--border);border-radius:7px;padding:5px 12px;font-size:12px;cursor:pointer;color:var(--muted);font-family:inherit;margin-top:.5rem;transition:all .15s}
.show-ans-btn:hover{border-color:var(--muted);color:var(--text)}
.word-bank{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:.875rem;padding:.75rem;background:var(--gray);border-radius:8px}
.wb-word{background:#fff;border:1px solid var(--border);border-radius:5px;padding:3px 10px;font-size:13px}
.wb-word.used{opacity:.35;text-decoration:line-through}

/* GAP FILL INPUT */
.gap-input{border:none;border-bottom:2px solid var(--orange);background:transparent;font-size:14px;font-family:inherit;min-width:80px;padding:2px 4px;outline:none;color:var(--text)}
.gap-input.correct{border-color:var(--teal);color:var(--teal)}
.gap-input.wrong{border-color:var(--red);color:var(--red)}

/* CHECKLIST */
.checklist-box{background:#fff;border:2px solid var(--teal);border-radius:14px;padding:1.5rem;margin-bottom:1rem;text-align:center}
.checklist-box h3{font-size:16px;font-weight:700;color:var(--teal);margin-bottom:1rem}
.cl-items{display:flex;flex-direction:column;gap:.6rem;text-align:left;max-width:380px;margin:0 auto 1.25rem}
.cl-item{display:flex;align-items:center;gap:10px;padding:.6rem .875rem;background:var(--gray);border-radius:8px;cursor:pointer;border:2px solid transparent;transition:all .15s}
.cl-item:hover{border-color:var(--teal)}
.cl-item.checked{background:#e8f7f0;border-color:var(--teal)}
.cl-check{width:22px;height:22px;border:2px solid var(--border);border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;font-size:14px}
.cl-item.checked .cl-check{background:var(--teal);border-color:var(--teal);color:#fff}
.cl-label{font-size:13px;font-weight:600}
.cl-done-msg{font-size:13px;color:var(--teal);font-weight:600;margin-top:.5rem;display:none}
.cl-done-msg.show{display:block}

/* CONFETTI */
.confetti-wrap{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:999;overflow:hidden}
.cp{position:absolute;width:9px;height:9px;border-radius:2px;animation:cffall linear forwards}
@keyframes cffall{0%{opacity:1;transform:translateY(-10px) rotate(0)}100%{opacity:0;transform:translateY(110vh) rotate(900deg)}}

/* VOCAB PAGE */
.vocab-page-header{background:var(--teal);color:#fff;border-radius:12px;padding:1rem 1.25rem;margin-bottom:1rem;display:flex;align-items:center;gap:10px}
.vocab-list-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vocab-list-item{background:#fff;border:1px solid var(--border);border-left:3px solid var(--teal);border-radius:8px;padding:.6rem .875rem;opacity:0;transform:translateY(6px);transition:all .28s ease}
.vocab-list-item.shown{opacity:1;transform:translateY(0)}
.vli-word{font-size:14px;font-weight:700;color:var(--teal)}
.vli-def{font-size:12px;color:var(--muted);margin-top:2px}

/* SCROLL */
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
</head>

<!-- TOP BAR -->
<div class="topbar">
  <div class="topbar-left">
    
    <h1>English with Dali &middot; Business English Level 1</h1>
  </div>

    <div class="overall-prog">
      <div class="overall-bar"><div class="overall-bar-fill" id="overall-fill"></div></div>

    <button class="home-btn" onclick="showHome()">&#127968; Home</button>
  </div>
</div>

<div class="main">
<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">

    <input type="text" placeholder="&#128269; Search modules…" oninput="filterSidebar(this.value)" id="search-input">

</div>

<!-- RIGHT PANEL -->

</div>
</div>

<div class="confetti-wrap" id="confetti-wrap"></div>

// STATE

let currentUnit = null;
let currentSlide = 0;
let completed = new Set();
try{completed=new Set(JSON.parse(localStorage.getItem('efe2_done')||'[]'));}catch(e){}
function save(){try{localStorage.setItem('efe2_done',JSON.stringify([...completed]));}catch(e){}}

// ═══════════════════════════════════════════════
// SIDEBAR
// ═══════════════════════════════════════════════
function buildSidebar(filter=''){
  const el = document.getElementById('sidebar-list');
  let html = '';
  Object.entries(CATS).forEach(([cat,[col,ids]])=>{
    const items = ids.filter(id=>{
      const u = UNITS[id];
      return !filter || u.title.toLowerCase().includes(filter.toLowerCase());
    });
    if(!items.length) return;
    html += `<div class="cat-group">
      <div class="cat-label" style="color:${col}">${cat}</div>`;
    items.forEach(id=>{
      const u=UNITS[id];
      const done=completed.has(id);
      const active=currentUnit===id;
      html+=`<div class="mod-item${active?' active':''}${done?' done':''}" onclick="openUnit(${id})" style="${active?`border-left-color:${col}`:''}">
        <span class="mod-num">${String(id).padStart(2,'0')}</span>
        <span class="mod-name">${u.title}</span>
        ${done?'<span class="mod-check">✓</span>':''}
      </div>`;
    });
    html+='</div>';
  });
  el.innerHTML=html;
}

function filterSidebar(v){buildSidebar(v);}

// ═══════════════════════════════════════════════
// HOME SCREEN
// ═══════════════════════════════════════════════
function showHome(){
  currentUnit=null;
  document.getElementById('home-screen').style.display='block';
  document.getElementById('slide-area').style.display='none';
  buildSidebar();
  renderHome();
  updateOverall();
}

function renderHome(){
  const total=47, done=completed.size;
  const pct=Math.round(done/total*100);
  let html=`<div class="home-title">English with Dali</div>
  <div class="home-sub">Business English Level 1 &mdash; Select a module from the sidebar to begin</div>
  <div class="home-stats">
    <div class="hstat"><div class="n">47</div><div class="l">Total modules</div></div>
    <div class="hstat"><div class="n">${done}</div><div class="l">Completed</div></div>
    <div class="hstat"><div class="n">${pct}%</div><div class="l">Progress</div></div>
  </div>`;
  Object.entries(CATS).forEach(([cat,[col,ids]])=>{
    html+=`<div class="home-cat">
      <div class="home-cat-title"><div class="home-cat-dot" style="background:${col}"></div>${cat}</div>
      <div class="home-cards">`;
    ids.forEach(id=>{
      const u=UNITS[id];
      const done=completed.has(id);
      html+=`<div class="hcard" style="border-left-color:${col}" onclick="openUnit(${id})">
        <div class="hcard-num">Unit ${String(id).padStart(2,'0')}</div>
        <div class="hcard-title">${u.title}</div>
        <div class="hcard-tags">
          ${u.lang?`<span class="hcard-tag tag-lang">${u.lang}</span>`:''}
          ${u.vocab?`<span class="hcard-tag tag-vocab">${u.vocab}</span>`:''}
          ${u.skill?`<span class="hcard-tag tag-skill">${u.skill}</span>`:''}
        </div>
        ${done?'<div class="hcard-done">✓ Completed</div>':''}
      </div>`;
    });
    html+='</div></div>';
  });
  document.getElementById('home-screen').innerHTML=html;
}

function updateOverall(){
  const pct=Math.round(completed.size/47*100);
  document.getElementById('overall-fill').style.width=pct+'%';
  document.getElementById('overall-txt').textContent=`${completed.size}/47`;
}

// ═══════════════════════════════════════════════
// OPEN UNIT
// ═══════════════════════════════════════════════
function openUnit(id){
  currentUnit=id;
  currentSlide=0;
  document.getElementById('home-screen').style.display='none';
  document.getElementById('slide-area').style.display='flex';
  const u=UNITS[id];
  document.getElementById('sh-title').textContent=`Unit ${String(id).padStart(2,'0')}: ${u.title}`;
  document.getElementById('sh-sub').textContent=[u.lang,u.vocab,u.skill].filter(Boolean).join(' · ');
  buildSidebar();
  buildDots();
  goToSlide(0);
}

function buildDots(){
  const u=UNITS[currentUnit];
  const html=u.slides.map((_,i)=>`<div class="dot" onclick="goToSlide(${i})" id="dot-${i}"></div>`).join('');
  document.getElementById('slide-dots').innerHTML=html;
}

function updateDots(){
  const u=UNITS[currentUnit];
  u.slides.forEach((_,i)=>{
    const d=document.getElementById(`dot-${i}`);
    if(!d)return;
    d.className='dot'+(i===currentSlide?' active':i<currentSlide?' done':'');
  });
}

// ═══════════════════════════════════════════════
// SLIDE NAVIGATION
// ═══════════════════════════════════════════════
function goToSlide(idx){
  currentSlide=idx;
  const u=UNITS[currentUnit];
  const total=u.slides.length;
  document.getElementById('prog-text').textContent=`${idx+1} / ${total}`;
  document.getElementById('prog-fill').style.width=((idx+1)/total*100)+'%';
  document.getElementById('btn-back').disabled=idx===0;
  document.getElementById('btn-next').textContent=idx===total-1?'Finish ✓':'Next →';
  updateDots();
  renderSlide(u.slides[idx]);
}

function prevSlide(){if(currentSlide>0)goToSlide(currentSlide-1);}
function nextSlide(){
  const u=UNITS[currentUnit];
  if(currentSlide<u.slides.length-1){goToSlide(currentSlide+1);}
  else{
    completed.add(currentUnit);save();
    buildSidebar();updateOverall();
    const msg=document.createElement('div');
    msg.style.cssText='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;border-radius:16px;padding:2rem 2.5rem;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.2);z-index:100;border:2px solid var(--teal)';
    msg.innerHTML=`<div style="font-size:32px;margin-bottom:.5rem">🎉</div><div style="font-size:18px;font-weight:700;color:var(--teal)">Unit ${currentUnit} Complete!</div><div style="font-size:13px;color:var(--muted);margin-top:.5rem">${completed.size} of 47 modules done</div><button onclick="this.parentNode.remove();showHome()" style="margin-top:1rem;background:var(--teal);color:#fff;border:none;border-radius:8px;padding:9px 22px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">Back to Home</button>`;
    document.body.appendChild(msg);
    fireConfetti();
  }
}

// ═══════════════════════════════════════════════
// RENDER SLIDE
// ═══════════════════════════════════════════════
function renderSlide(s){
  const c=document.getElementById('slides-container');
  c.innerHTML='';
  const div=document.createElement('div');
  div.className='slide active';
  div.innerHTML=buildSlideHTML(s);
  c.appendChild(div);
  activateAnimations(s);
}

function buildSlideHTML(s){
  switch(s.type){
    case 'intro': return buildIntro();
    case 'key-lang': return buildKeyLang(s);
    case 'grammar': return buildGrammar(s);
    case 'examples': return buildExamples(s);
    case 'vocab-list': return buildVocabList(s);
    case 'exercise': return buildExercise(s);
    case 'checklist': return buildChecklist(s);
    default:return '';
  }
}

function buildIntro(){
  const id=currentUnit;
  const u=UNITS[id];
  return `<div class="intro-slide">
    <div class="intro-num">Unit ${String(id).padStart(2,'0')}</div>
    <div class="intro-title">${u.title}</div>
    <div class="intro-desc">${u.desc}</div>
    <div class="intro-tags">
      ${u.lang?`<div class="intro-tag"><span class="intro-tag-icon">⚙️</span><div><span class="intro-tag-label">New language</span><span class="intro-tag-val">${u.lang}</span></div></div>`:''}
      ${u.vocab?`<div class="intro-tag"><span class="intro-tag-icon">📖</span><div><span class="intro-tag-label">Vocabulary</span><span class="intro-tag-val">${u.vocab}</span></div></div>`:''}
      ${u.skill?`<div class="intro-tag"><span class="intro-tag-icon">🎯</span><div><span class="intro-tag-label">New skill</span><span class="intro-tag-val">${u.skill}</span></div></div>`:''}
    </div>
  </div>`;
}

function buildKeyLang(s){
  let bubblesHTML=s.bubbles.map(b=>`
    <div class="bubble-pair">
      ${b.note?`<div class="bubble-note">${b.note}</div>`:''}
      ${b.a?`<div class="bubble bubble-a">${b.a}</div>`:''}
      ${b.b?`<div class="bubble bubble-b">${b.b}</div>`:''}
    </div>`).join('');
  return `<div class="key-lang-box">
    <h3>${s.label}</h3>
    <div class="subtitle">${s.subtitle||''}</div>
    <div class="bubbles-grid">${bubblesHTML}</div>
  </div>`;
}

function buildGrammar(s){
  let rows=s.rows.map((r,i)=>`<tr><td>${r[0]}</td>${r.slice(1).map(c=>`<td class="grammar-highlight">${c}</td>`).join('')}</tr>`).join('');
  return `<div class="grammar-box">
    <h3>${s.label||''}</h3>
    <div class="subtitle">${s.subtitle||''}</div>
    <table class="grammar-table">
      <thead><tr>${s.cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

function buildExamples(s){
  let items=s.items.map(it=>`
    <div class="example-item">
      <div class="example-icon">${it.icon||'📌'}</div>
      <div><div class="example-text">${it.text.replace(it.highlight||'','<span class="ex-highlight">'+it.highlight+'</span>')}</div>
      ${it.note?`<div class="example-note">${it.note}</div>`:''}</div>
    </div>`).join('');
  return `<div class="examples-box">
    <h3>${s.label||''} — ${s.title||''}</h3>
    ${items}
  </div>`;
}

function buildVocabList(s){
  let items=s.items.map(it=>`
    <div class="vocab-list-item">
      <div class="vli-word">${it.word}</div>
      ${it.def?`<div class="vli-def">${it.def}</div>`:''}
    </div>`).join('');
  return `<div>
    <div class="vocab-page-header"><span style="font-size:20px">📖</span><span style="font-size:15px;font-weight:700">${s.label} — ${s.title}</span></div>
    <div class="vocab-list-grid">${items}</div>
  </div>`;
}

function buildExercise(s){
  let wb='';
  if(s.wordbank){
    wb=`<div class="word-bank">${s.wordbank.map((w,i)=>`<span class="wb-word" id="wb-${i}">${w}</span>`).join('')}</div>`;
  }
  let items=s.items.map((it,i)=>`
    <div class="ex-item" id="ex-${i}">
      <div class="ex-q">${i+1}. ${it.q}</div>
      <div class="options-row">
        ${it.opts?it.opts.map((o,j)=>`<button class="opt" onclick="checkAnswer(${i},'${o.replace(/'/g,"\\'")}','${it.answer.replace(/'/g,"\\'")}',this)">${o}</button>`).join(''):''}
      </div>
      <div class="ex-feedback" id="fb-${i}"></div>
      <button class="show-ans-btn" onclick="showAnswer(${i},'${it.answer.replace(/'/g,"\\'")}')">Show answer</button>
    </div>`).join('');
  return `<div class="exercise-box">
    <h3>${s.label}</h3>
    <div class="ex-instruction">${s.title}</div>
    ${wb}${items}
  </div>`;
}

function buildChecklist(s){
  const uid=currentUnit;
  let clKey=`efe2_cl_${uid}`;
  let checked=new Set();
  try{checked=new Set(JSON.parse(localStorage.getItem(clKey)||'[]'));}catch(e){}
  let items=s.items.map((it,i)=>`
    <div class="cl-item${checked.has(i)?' checked':''}" id="cl-${i}" onclick="toggleCL(${i},'${clKey}','${it.replace(/'/g,"\\'")}')">
      <div class="cl-check">${checked.has(i)?'✓':''}</div>
      <div class="cl-label">${it}</div>
    </div>`).join('');
  return `<div class="checklist-box">
    <h3>✅ Unit ${String(uid).padStart(2,'0')} Checklist</h3>
    <div style="font-size:13px;color:var(--muted);margin-bottom:1rem">Tick off each topic when you feel confident</div>
    <div class="cl-items">${items}</div>
    <div class="cl-done-msg${checked.size===s.items.length?' show':''}" id="cl-done">🎉 All topics checked! Well done!</div>
  </div>`;
}

// ═══════════════════════════════════════════════
// ACTIVATE ANIMATIONS
// ═══════════════════════════════════════════════
function activateAnimations(s){
  if(s.type==='key-lang'){
    const bubbles=document.querySelectorAll('.bubble');
    bubbles.forEach((b,i)=>setTimeout(()=>b.classList.add('shown'),200+i*180));
  }
  if(s.type==='grammar'){
    const rows=document.querySelectorAll('.grammar-table tbody tr');
    rows.forEach((r,i)=>setTimeout(()=>r.classList.add('shown'),150+i*200));
  }
  if(s.type==='examples'){
    const items=document.querySelectorAll('.example-item');
    items.forEach((el,i)=>setTimeout(()=>el.classList.add('shown'),100+i*160));
  }
  if(s.type==='vocab-list'){
    const items=document.querySelectorAll('.vocab-list-item');
    items.forEach((el,i)=>setTimeout(()=>el.classList.add('shown'),50+i*60));
  }
}

// ═══════════════════════════════════════════════
// EXERCISE INTERACTIONS
// ═══════════════════════════════════════════════
function checkAnswer(idx,chosen,answer,btn){
  const box=document.getElementById(`ex-${idx}`);
  if(box.dataset.answered) return;
  box.dataset.answered='1';
  box.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  const fb=document.getElementById(`fb-${idx}`);
  if(chosen===answer){
    btn.classList.add('correct-opt');
    box.classList.add('correct-bg');
    fb.className='ex-feedback show ok';
    fb.innerHTML='✅ Correct!';
    fireConfetti();
  } else {
    btn.classList.add('wrong-opt');
    box.classList.add('wrong-bg');
    fb.className='ex-feedback show bad';
    fb.innerHTML=`❌ The correct answer is: <strong>${answer}</strong>`;
  }
}

function showAnswer(idx,answer){
  const box=document.getElementById(`ex-${idx}`);
  if(box.dataset.answered) return;
  box.dataset.answered='1';
  box.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  const fb=document.getElementById(`fb-${idx}`);
  fb.className='ex-feedback show ok';
  fb.innerHTML=`💡 Answer: <strong>${answer}</strong>`;
}

// ═══════════════════════════════════════════════
// CHECKLIST
// ═══════════════════════════════════════════════
function toggleCL(idx,key,label){
  let checked=new Set();
  try{checked=new Set(JSON.parse(localStorage.getItem(key)||'[]'));}catch(e){}
  if(checked.has(idx)) checked.delete(idx); else checked.add(idx);
  try{localStorage.setItem(key,JSON.stringify([...checked]));}catch(e){}
  const el=document.getElementById(`cl-${idx}`);
  el.classList.toggle('checked',checked.has(idx));
  el.querySelector('.cl-check').textContent=checked.has(idx)?'✓':'';
  const u=UNITS[currentUnit];
  const sl=u.slides[currentSlide];
  const done=document.getElementById('cl-done');
  if(done) done.classList.toggle('show',checked.size===sl.items.length);
}

// ═══════════════════════════════════════════════
// CONFETTI
// ═══════════════════════════════════════════════
function fireConfetti(){
  const wrap=document.getElementById('confetti-wrap');
  const cols=['#E53E3E','#1D9E75','#378ADD','#E67E22','#D69E2E','#8E44AD','#fff'];
  for(let i=0;i<30;i++){
    const p=document.createElement('div');
    p.className='cp';
    p.style.cssText=`left:${Math.random()*100}%;background:${cols[Math.floor(Math.random()*cols.length)]};animation-duration:${.8+Math.random()*.8}s;animation-delay:${Math.random()*.4}s;border-radius:${Math.random()>.5?'50%':'2px'};width:${6+Math.random()*6}px;height:${6+Math.random()*6}px`;
    wrap.appendChild(p);
    setTimeout(()=>p.remove(),1800);
  }
}

// ═══════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════
buildSidebar();
showHome();
</script>
</body>
</html>
